<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e2e2df">
  <title>Slovo</title>
  <link rel="icon" href="/static/logo.png">
  <script src="https://telegram.org/js/telegram-web-app.js?63" async></script>
  <link rel="preload" href="/static/fonts/RobotoCondensed-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/static/fonts/Manrope-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/static/caldera-tokens.css?v=15">
  <link rel="stylesheet" href="/static/styles.css?v=20">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="Slovo"><img src="/static/logo.png" alt=""><span>SLOVO</span></button>
      <button id="avatarButton" class="avatar" data-action="profile" aria-label="Profile">S</button>
    </header>
    <main id="content" class="content" aria-live="polite">
      <section class="launch-screen">
        <img src="/static/logo.png" alt="Slovo" class="launch-logo">
        <h1>Slovo</h1><p>Загружаем слова…</p><div class="loader" aria-hidden="true"></div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-action="home"><span data-icon="folder"></span><small data-i18n="folders">Папки</small></button>
      <button class="nav-item" data-action="learn"><span data-icon="cards"></span><small data-i18n="learn">Учить</small></button>
      <button class="nav-item" data-action="profile"><span data-icon="user"></span><small data-i18n="profile">Профиль</small></button>
    </nav>
  </div>
  <div id="modal" class="modal" hidden>
    <button class="modal-backdrop" data-action="close-modal" aria-label="Close"></button>
    <section class="modal-sheet"><div class="grabber"></div><button class="icon-button modal-close" data-action="close-modal" aria-label="Close"><span data-icon="close"></span></button><div id="modalContent"></div></section>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js?v=20" defer></script>
</body>
</html>
